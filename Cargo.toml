[workspace]
resolver = "3"
members = [
    "crates/rk-types",
    "crates/rk-store",
    "crates/rk-api",
    "crates/rk-scheduler",
    "crates/rk-controllers",
    "crates/rk-runtime",
    "crates/rk-net",
    "crates/rk-agent",
    "crates/rk-ctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# internal crates
rk-types = { path = "crates/rk-types" }
rk-store = { path = "crates/rk-store" }
rk-runtime = { path = "crates/rk-runtime" }
rk-net = { path = "crates/rk-net" }

# async + http
tokio = { version = "1", features = ["full"] }
axum = "0.8"
hyper = { version = "1", features = ["full"] }
tower = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# cli + diagnostics
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

# containers & linux primitives (referenced from Phase 1 on)
nix = { version = "0.30", features = ["fs", "hostname", "mount", "net", "process", "sched", "signal", "user"] }
oci-client = { version = "0.15", default-features = false, features = ["rustls-tls"] }
oci-spec = "0.8"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"   # digest verification of pulled blobs
xattr = "1"     # overlayfs opaque-dir markers when unpacking whiteouts

# storage (referenced from Phase 2 on)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

# networking (referenced from Phase 6 on)
rtnetlink = "0.17"
ipnetwork = "0.21"

# tls (referenced from Phase 8 on)
rustls = "0.23"
rcgen = "0.14"
axum-server = { version = "0.7", features = ["tls-rustls"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"

# support
http-body-util = "0.1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
async-trait = "0.1"
futures-core = "0.3"
futures-util = "0.3"
tempfile = "3"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
