[workspace]
resolver = "3"
members = [
    "crates/rk-types",
    "crates/rk-store",
    "crates/rk-api",
    "crates/rk-scheduler",
    "crates/rk-controllers",
    "crates/rk-runtime",
    "crates/rk-net",
    "crates/rk-agent",
    "crates/rk-ctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# internal crates
rk-types = { path = "crates/rk-types" }
rk-store = { path = "crates/rk-store" }
rk-runtime = { path = "crates/rk-runtime" }
rk-net = { path = "crates/rk-net" }

# async + http
tokio = { version = "1", features = ["full"] }
axum = "0.8"
hyper = { version = "1", features = ["full"] }
tower = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# cli + diagnostics
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

# containers & linux primitives (referenced from Phase 1 on)
nix = "0.30"
oci-client = "0.15"
oci-spec = "0.8"
flate2 = "1"
tar = "0.4"

# storage (referenced from Phase 2 on)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }

# networking (referenced from Phase 6 on)
rtnetlink = "0.17"
ipnetwork = "0.21"

# tls (referenced from Phase 8 on)
rustls = "0.23"
rcgen = "0.14"

# support
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
async-trait = "0.1"
futures-core = "0.3"
tempfile = "3"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
