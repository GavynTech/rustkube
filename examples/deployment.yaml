# A Deployment the controllers reconcile end to end: the Deployment controller
# creates a ReplicaSet, the ReplicaSet controller creates 3 pods, the
# scheduler places them, and the agents run them. Edit the image and re-apply
# to watch a rolling update; `rk-ctl scale` to resize.
apiVersion: v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
