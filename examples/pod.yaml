# The Phase 2 demo manifest: a pod the control plane can store, list, watch
# and delete. Nothing schedules or runs it yet — that is Phases 3 and 4.
apiVersion: v1
kind: Pod
metadata:
  name: web-0
  labels:
    app: web
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 250m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
