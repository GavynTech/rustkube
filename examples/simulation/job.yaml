apiVersion: v1
kind: Job
metadata:
  name: rabi-sweep
spec:
  completions: 9
  parallelism: 2
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        rustkube.io/hostname: home-ryzen
      containers:
        - name: sim
          image: python:3.12-slim
          command: [python, /code/sweep.py]
          env:
            - name: OMP_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: code
              mountPath: /code
              readOnly: true
            - name: results
              mountPath: /results
            - name: scratch
              mountPath: /scratch
      volumes:
        - name: code
          hostPath:
            path: /srv/rustkube/simulation/code
        - name: results
          hostPath:
            path: /srv/rustkube/simulation/results
        - name: scratch
          emptyDir: {}
