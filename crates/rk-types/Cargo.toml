[package]
name = "rk-types"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The HTTP/watch client + the list/watch reflector for talking to rk-api
# (agent, scheduler, controllers, CLI). Off by default so pure-types consumers
# don't build reqwest/tokio.
client = ["dep:reqwest", "dep:futures-core", "dep:futures-util", "dep:tokio"]

[dependencies]
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
base64.workspace = true

reqwest = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
